# Gates for every push and pull request. deploy.yml runs after this workflow passes on main, so every job here, the
# browser e2e included, stands between a commit and the live app. The jobs are also required status checks on main
# (branch protection), so main only takes commits that passed them on a branch first (CONTRIBUTING-FEATURES.md).
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Privacy check (every tracked file)
        run: node tools/check-privacy.mjs --all
      - name: Privacy check (every version of every file in history)
        run: node tools/check-privacy.mjs --history
      - name: No hard-coded dates in src
        run: node tools/check-dates.mjs

  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tz: [America/New_York, Europe/Berlin, Asia/Kolkata]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }   # test_b1/test_match compare against the Python reference checkers
      - name: Install dev dependencies (fake-indexeddb for the adapter conformance suite)
        run: npm ci --ignore-scripts
      - name: Unit tests (TZ=${{ matrix.tz }})
        env: { TZ: '${{ matrix.tz }}' }
        run: node --test 'tests/unit/*.test.mjs'

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: tsc strict (core, data, new domain modules)
        run: npx tsc -p tsconfig.json
      - name: tsc ratchet (every other module, strict; the error count may only fall)
        run: node tools/typecheck-ratchet.mjs

  content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Manifest is current and every file matches its JSON Schema
        run: node tools/validate-content.mjs
      - name: Every language pack (manifest packs[lang]; the validators take the language, tools/langrules.py)
        run: node tools/validate-packs.mjs
      - name: Built content matches its sources
        run: |
          python3 tools/build_b1.py
          python3 tools/build_turns.py
          python3 tools/build_schreiben.py
          node tools/build-clusters.mjs
          node tools/build-wordbuild.mjs
          node tools/build-manifest.mjs
          git diff --exit-code -- content

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Manifest is current
        run: node tools/build-manifest.mjs --check
      - name: Build the site the deploy would publish
        run: node tools/stamp.mjs --out _site
      - name: Privacy check (built site)
        run: node tools/check-privacy.mjs --dir _site

  # Browser e2e (tests/e2e, ARCHITECTURE §8): the site the deploy would publish (tools/stamp.mjs → _site), in WebKit at
  # an iPhone's 390 px and in desktop Chromium, with a synthetic profile. Every request to another host is answered by
  # a mock or fails the test, and service workers are blocked (one offline spec runs its own worker against its own
  # server), so no token can reach GitHub. axe serious/critical findings and any console error fail it.
  e2e:
    runs-on: ubuntu-24.04
    # the suite runs in about 7 minutes; installing the browsers' system libraries from apt has taken up to 6 on its
    # own (7 Oct 2026), which cancelled main's e2e twice at the old 12-minute cap
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install the browsers' system libraries (cached browsers)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: tsc strict on the e2e suite
        run: npx tsc -p tests/e2e/tsconfig.json
      - name: Stamp the site and run the e2e suite
        run: npm run test:e2e
      - name: Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
